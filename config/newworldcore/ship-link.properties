# Ship Link: oyuncu arayuzunun gemiye surekli baglantisi. Sunucu yetkilidir; canli yeniden okunur.
# Birim blok, 3B oyuncu-konumundan geminin dis konumuna mesafe. Sinir: 16..30000000.
# Artirmak uzaktan erisimi genisletir; azaltmak menzil disinda Survey/Discoveries islemlerini kilitler.
# Kendi geminin icinde menzil uygulanmaz. Chunk yuklemez, ucus veya kazimi durdurmaz.
range_blocks=5000

# Farkli boyuttan baglanti: true DIMENSIONAL erisim, false LOST ve uzaktan islemler kapali.
# Kendi geminin ici her zaman CONNECTED sayilir. Sahiplik denetimi bu ayarla atlanamaz.
allow_dimensional_link=true

# Yenileme araligi, tick; 20 tick yaklasik 1 saniye. Sinir: 20..1200.
# Dusurmek daha sik veri ve daha fazla paket demektir. Yalniz Player GUI acikken sorgulanir.
# Sunucu degeri istemciye bildirilir; istemci daha sik sorgulasa da sunucu hiz siniri uygular.
refresh_ticks=20

# Son sunucu verisinin gecerliligi, tick; 120 yaklasik 6 saniye. Sinir: 40..3600.
# En az yenileme araliginin iki kati uygulanir. Veri eskidiginde LOST gorunur ve islemler kilitlenir.
# Artirmak gecikmeye toleransi artirir; azaltmak baglanti kaybini daha erken gosterir.
stale_after_ticks=120
