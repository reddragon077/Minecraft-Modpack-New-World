# NEW WORLD - GUI / ARAYUZ AYARLARI
# Bu dosya yalnizca gorunumu etkiler; dunya kaydi veya tarama sonucunu degistirmez.

# Radar ve Geology filtre pencerelerinin diger yazi/sekillerin onunde cizilecegi derinlik.
# Normalde 1000 guvenlidir. Panel arkada kalirsa artirin; gereksiz yere cok buyutmeyin.
filters.overlay_z=1000

# Oyuncu arayuzu acildiginda arka dunyanin karartilma orani (yuzde).
# 0 karartmaz, 100 tamamen siyah yapar. Varsayilan 70 okunabilirlik icin dengelidir.
player.background_dim_percent=70

# SURVEY sekmesinde gercek config menzilini gosterir.
# false yapilirsa menzil satirdan gizlenir; taramanin gercek menzili degismez.
player.show_survey_range=true

# SURVEY sekmesinde ayarlanan gecikmeyi yaklasik saniye olarak gosterir.
# false yapilirsa sure satirdan gizlenir; taramanin gercek gecikmesi degismez.
player.show_survey_delay=true
