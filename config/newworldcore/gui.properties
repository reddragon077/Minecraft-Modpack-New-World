# NEW WORLD - GUI / ARAYUZ AYARLARI
# Bu dosya yalnizca gorunumu etkiler; dunya kaydi veya tarama sonucunu degistirmez.

# Radar ve Geology filtre pencerelerinin diger yazi/sekillerin onunde cizilecegi derinlik.
# Normalde 1000 guvenlidir. Panel arkada kalirsa artirin; gereksiz yere cok buyutmeyin.
filters.overlay_z=1000

# Oyuncu arayuzu acildiginda arka dunyanin karartilma orani (yuzde).
# 0 karartmaz, 100 tamamen siyah yapar. Varsayilan 70 okunabilirlik icin dengelidir.
player.background_dim_percent=70

# SURVEY sekmesinde gercek config menzilini gosterir.
# false yapilirsa menzil satirdan gizlenir; taramanin gercek menzili degismez.
player.show_survey_range=true

# SURVEY sekmesinde ayarlanan gecikmeyi yaklasik saniye olarak gosterir.
# false yapilirsa sure satirdan gizlenir; taramanin gercek gecikmesi degismez.
player.show_survey_delay=true

# DISCOVERIES sekmesi acildiginda her kategori icin alinacak en yeni kayit sayisi.
# Structure ve Geology kotalari ayridir; bir tarama turu digerini listeden dusuremez.
# Daha yuksek deger daha fazla gecmis gosterir fakat ilk acilisi ve ag trafigini artirir (16-256).
player.discoveries.sync_limit_per_category=64

# DISCOVERIES listesindeki sayfa basina satir sayisi.
# 5 daha ferah, 6 daha fazla kaydi ayni ekranda gosterir (5-6).
player.discoveries.rows_per_page=6

# DISCOVERIES ayrinti panelindeki TARGET dugmesini acar/kapatir.
# true: secili kaydi geminin ortak Navigation hedefi yapar.
player.discoveries.enable_target_action=true

# DISCOVERIES ayrinti panelindeki ROUTE dugmesini acar/kapatir.
# true: secili kaydi hedef yapar ve mevcut Navigation motoruyla rota/hop plani olusturur.
player.discoveries.enable_route_action=true

# DISCOVERIES ayrinti panelindeki FAV dugmesini acar/kapatir.
# true: secili ortak kaydin favori durumunu degistirir ve Navigation favorileriyle paylasir.
player.discoveries.enable_favorite_action=true
