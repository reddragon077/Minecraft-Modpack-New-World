# NEW WORLD - GEMI AGI ACIL ENERJI AYARLARI

# true: normal tüketiciler Emergency Power Policy tarafından sınırlandırılır ve acil FE rezervi korunur.
# false: tüketiciler rezervi de kullanabilir; kritik sistemler için ayrılmış enerji tükenebilir.
# Normal oynanışta true bırakılması önerilir.
emergency_reserve.enabled=true

# ASAGIDAKI CARPANLAR AG DUGUMLERININ MK0-MK8 TABLOLARININ TAMAMINA UYGULANIR.
# 1.0 varsayilan hiz/kapasitedir; 0.5 yariya indirir; 2.0 iki katina cikarir.
# Degerler en az 1'e sabitlenir ve tam sayi sinirini asarsa guvenli ust sinira cekilir.

# FE dugumlerinin tick basina aktarim hiz carpani.
node.transfer.fe_multiplier=1.0

# Esya dugumlerinin tick basina item aktarim hiz carpani.
node.transfer.item_multiplier=1.0

# Sivi dugumlerinin tick basina mB aktarim hiz carpani.
node.transfer.fluid_multiplier=1.0

# Gaz/chemical dugumlerinin tick basina aktarim hiz carpani.
node.transfer.gas_multiplier=1.0

# FE dugumlerinin dahili tampon kapasitesi carpani.
node.capacity.fe_multiplier=1.0

# Esya dugumlerinin dahili tampon kapasitesi carpani.
node.capacity.item_multiplier=1.0

# Sivi dugumlerinin dahili tampon kapasitesi carpani.
node.capacity.fluid_multiplier=1.0

# Gaz/chemical dugumlerinin dahili tampon kapasitesi carpani.
node.capacity.gas_multiplier=1.0
