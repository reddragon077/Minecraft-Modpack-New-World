# NEW WORLD - OYUNCU ARAYUZU VE FIELD SURVEY AYARLARI
# 20 tick yaklaşık 1 saniyedir. Bu ayarlar gemi Radar/Geology taramalarını etkilemez.

# Structure Field Survey'nin oyuncu çevresinde doğrulayacağı azami yatay mesafe (blok).
# Küçük değer yalnız gerçekten yakın/ziyaret edilen yapıları tanır ve kontrol edilen chunk sayısını azaltır.
# 48 blok varsayılanında yaklaşık 7x7 chunk konumu kontrol edilir; eski 96 blok yaklaşık 13x13 idi.
field_survey.range_blocks=48

# Oyuncu STRUCTURE SCAN düğmesine bastıktan sonra sonucun gelme gecikmesi (tick).
# 80 tick yaklaşık 4 saniyedir. 0 yapılırsa sonuç aynı tick içinde gelir.
# Tarama beklerken ikinci kez basılırsa yeni bir tarama kuyruğa eklenmez.
field_survey.delay_ticks=80

# Geological Field Survey'nin oyuncu çevresinde arayacağı yatay yarıçap (blok).
# Bu tarama yalnız yüklü chunk'lardaki gerçek cevher/depozit bloklarını doğrular; uzak Radar tahmini değildir.
geological_survey.horizontal_range_blocks=48

# Geological Field Survey'nin oyuncunun altına ve üstüne bakacağı azami dikey mesafe (blok).
# Derindeki depozitleri yüzeyden doğrulamak için yatay menzilden daha büyük tutulabilir.
geological_survey.vertical_range_blocks=128

# Oyuncu GEOLOGICAL SCAN düğmesine bastıktan sonra sonucun gelme gecikmesi (tick).
# 80 tick yaklaşık 4 saniyedir; tarama sürerken ikinci istek kuyruğa eklenmez.
geological_survey.delay_ticks=80

# Tek taramada Discovery Database'e yazılacak azami doğrulanmış depozit sayısı.
geological_survey.max_results=8

# Her depozit adayı için kontrol edilecek azami şablon bloğu sayısı.
# Yükseltmek kısmen bozulmuş depozitleri bulmayı kolaylaştırabilir, fakat ana thread yükünü artırır.
geological_survey.max_block_checks_per_candidate=4096

# Bir adayın fiziksel depozit sayılması için dünyada eşleşmesi gereken asgari şablon bloğu.
# 1 daha toleranslıdır; yüksek değerler yanlış eşleşmeyi azaltır ama kazılmış depozitleri kaçırabilir.
geological_survey.minimum_matching_blocks=3
