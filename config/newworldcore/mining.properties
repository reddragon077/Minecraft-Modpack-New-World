# NEW WORLD - MINING MATRIX AYARLARI
# 20 tick yaklaşık 1 saniyedir. level_0 yükseltmesiz, level_1/2/3 yükseltme seviyeleridir.

# Bir Mining taramasında kullanılacak probe/örnek sayısı.
# Yüksek değer daha geniş/yoğun örnekleme sağlar, fakat tarama iş yükünü artırır.
scan.probes.level_0=512
scan.probes.level_1=768
scan.probes.level_2=1024
scan.probes.level_3=1536

# İki kazım işlemi arasındaki bekleme süresi (tick). Düşük değer = daha hızlı üretim ve daha yüksek yük.
# Varsayılanlar sırasıyla 2,0 / 1,5 / 1,0 / 0,5 saniyedir.
mine.interval_ticks.level_0=40
mine.interval_ticks.level_1=30
mine.interval_ticks.level_2=20
mine.interval_ticks.level_3=10

# Speed seviyesine göre her kazım işleminin Efficiency uygulanmadan önceki temel FE maliyeti.
energy.base_fe.level_0=5000
energy.base_fe.level_1=7000
energy.base_fe.level_2=10000
energy.base_fe.level_3=14000

# Efficiency seviyesinin temel kazım maliyetine uyguladığı yüzde. Düşük yüzde = daha az FE tüketimi.
energy.efficiency_percent.level_0=100
energy.efficiency_percent.level_1=82
energy.efficiency_percent.level_2=65
energy.efficiency_percent.level_3=50

# Arayüzde Efficiency tasarrufunu örneklemek için kullanılan referans FE değeri.
# Gerçek kazım maliyeti yukarıdaki Speed tabanı ve Efficiency yüzdesinden hesaplanır.
energy.display_base_fe=5000
