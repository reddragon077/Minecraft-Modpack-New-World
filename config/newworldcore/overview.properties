# NEW WORLD - OVERVIEW / GEMI DURUMU
# Salt okunur telemetri; geminin calisma ayarlarini degistirmez. Degisiklikler yeniden JAR gerektirmez.
# Sunucu esikleri ve istemci gorunumu kendi configlerinden okunur; iki PC icin GitHub ile esitleyin.

# Ekran acikken veri isteme ve sunucuda istek kabul etme araligi (tick, 20 tick ~ 1 saniye).
# 40 yaklasik 2 saniyedir. Artirmak ag/CPU yukunu azaltir; azaltmak veriyi daha sik yeniler (20-1200).
refresh_ticks=40

# FE veya Warp dolulugu bu yuzdeye indiginde WARNING verilir (1-99).
# Artirmak daha erken dusuk enerji uyarisi verir. Kapasitesi bilinmeyen kaynak UNKNOWN/WARNING olur.
warning_percent=20

# FE veya Warp dolulugu bu yuzdeye indiginde CRITICAL verilir (0-98).
# Artirmak kritik uyariyi erken verir; warning_percent degerinden buyukse ona sinirlanir.
critical_percent=5

# Yeni paket gelmeyince verinin STALE sayilacagi sure (tick, 40-3600).
# Gercek alt sinir refresh_ticks * 2'dir. Eski veri bu durumda guncelmis gibi gosterilmez.
stale_after_ticks=120

# Gorunen son uyari satiri sayisi (1-3). Azaltmak ekranin altini sadelestirir.
# Gecmis yalniz bu oyuncunun baglanti/gemi gozlem oturumu icindir; kalici dunya gunlugu degildir.
warning_rows=2
