# Player Navigation: değişiklikler canlı okunur; JAR yenilemek gerekmez.
# Yenileme süresi, tick (20 tick yaklaşık 1 saniye). Güvenli sınır 20-1200.
# Artırmak ağ/telemetri yükünü azaltır, azaltmak daha sık bilgi getirir; en hızlı 1 saniyedir.
refresh_ticks=20

# Son yanıtın eskime süresi, tick; 40-3600 ve en az yenilemenin iki katı.
# Artırmak eski verinin daha uzun görünmesine izin verir. Link kaybı yine derhal erişimi kapatır.
stale_after_ticks=120

# true: hedef/sonraki hop koordinatlarını gösterir; false: yalnız görünümü gizler.
# Dünya verisi, menzil ve geminin hedefi değişmez.
show_coordinates=true

# true: gerçek motor formülüyle yüklü sonraki hopun tahmini WE bedelini gösterir.
# false: yalnız maliyet satırını gizler. Enerji tüketimini değiştirmez, uçuş izni vermez.
# Toplam rota maliyeti değildir; hedef değiştirilmiş veya veri yoksa sayı uydurulmaz.
show_we_estimate=true
