# Player Navigation: değişiklikler canlı okunur; JAR yenilemek gerekmez.
# Yenileme süresi, tick (20 tick yaklaşık 1 saniye). Güvenli sınır 20-1200.
# Artırmak ağ/telemetri yükünü azaltır, azaltmak daha sık bilgi getirir; en hızlı 1 saniyedir.
refresh_ticks=20

# Son yanıtın eskime süresi, tick; 40-3600 ve en az yenilemenin iki katı.
# Artırmak eski verinin daha uzun görünmesine izin verir. Link kaybı yine derhal erişimi kapatır.
stale_after_ticks=120

# true: hedef/sonraki hop koordinatlarını gösterir; false: yalnız görünümü gizler.
# Dünya verisi, menzil ve geminin hedefi değişmez.
show_coordinates=true

# true: gerçek motor formülüyle yüklü sonraki hopun tahmini WE bedelini gösterir.
# false: yalnız maliyet satırını gizler. Enerji tüketimini değiştirmez, uçuş izni vermez.
# Toplam rota maliyeti değildir; hedef değiştirilmiş veya veri yoksa sayı uydurulmaz.
show_we_estimate=true

# true: Navigation FAVORITES listesini ve buradan SEND TO SHIP hedef seçimini açar.
# false: bu girişi istemcide gizler/devre dışı bırakır ve sunucuda engeller.
# Discoveries FAV/TARGET ayarları ayrıdır; hedef seçimi için enable_target_action da açık olmalıdır.
# Seçim yalnız ortak hedefi değiştirir; rota hesaplamaz, uçuş başlatmaz, WE tüketmez. Canlı okunur.
favorites.enabled=true

# Favori listesine tek istekte gönderilecek en yeni favori sayısı; 16-512 kayıt, varsayılan 128.
# Son keşif kotasından bağımsızdır: eski favoriler de okunur. Sınır aşılırsa SYNC gelen/toplam gösterir.
# Artırmak daha fazla favori gösterir ancak ağ yükünü artırır. REFRESH ile yeniden okunur; kayıt silmez.
favorites.sync_limit=128

# true: SAVE CURRENT LOCATION ile oyuncunun sunucudaki blok koordinatını ortak favorilere kaydeder.
# false: düğmeyi devre dışı bırakır ve sunucu yazımını engeller. Canlı okunur.
# Bağlantı/sahiplik şarttır; TARDIS iç mekânı kaydedilmez. Hedef, rota ve enerji değişmez.
location.enabled=true

# Gemi başına el ile kaydedilmiş konum sayısı; 1-1024, varsayılan 128.
# Artırmak kayıt dosyasını büyütebilir. Limit dolunca yeni konum reddedilir; eski kayıt silinmez.
# Aynı koordinatı yeniden kaydetmek kopya üretmez; mevcut keşif varsa içeriği korunup favoriye alınır.
# Limiti düşürmek mevcut konumları silmez. Canlı okunur; gerekirse artırarak yeni kayda izin ver.
location.max_per_ship=128

# Oyuncu başına konum kaydetme beklemesi, tick (20 tick yaklaşık 1 saniye); 20-1200.
# Varsayılan 40 = 2 saniye. Artırmak tekrar yazım yükünü azaltır; azaltmak daha sık kayda izin verir.
# Sunucuda uygulanır, canlı okunur; diğer oyuncuların beklemesini etkilemez.
location.cooldown_ticks=40

# true: FAVORITES içindeki SEND TO SHIP düğmesi seçili kaydı geminin ortak Navigation hedefi yapar.
# false: bu düğmeyi ve favori seçiciden sunucu hedef yazımını kapatır. Canlı okunur.
# favorites.enabled ve gui.properties player.discoveries.enable_target_action da açık olmalıdır.
# Yalnız hedef anahtarı değişir; mevcut rota/sonraki durak korunur, uçuş başlamaz, WE harcanmaz.
# Discoveries TARGET/ROUTE ayarlarını değiştirmez. Hedef göndermek gemiyi oyuncuya çağırmak değildir.
send_to_ship.enabled=true

# Oyuncu başına hedef gönderme beklemesi, tick (20 tick yaklaşık 1 saniye); 20-1200.
# Varsayılan 40 = 2 saniye. Artırmak tekrarlı hedef yazımını azaltır; azaltmak daha sık seçim sağlar.
# Sunucuda uygulanır ve canlı okunur; REFRESH veya sekme değişimi beklemeyi sıfırlamaz.
send_to_ship.cooldown_ticks=40
