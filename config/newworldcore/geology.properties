# NEW WORLD - JEOLOJI RADARI ENERJI AYARLARI
# level_0 yükseltmesiz, level_1/2/3 ilgili yükseltmenin seviyesidir.
# Nihai tarama maliyeti = görev sayısı x base FE x Range x Speed x Accuracy x Efficiency yüzdesi.

# Her jeoloji tarama görevinin yükseltmesiz temel FE maliyeti.
scan.energy.base_fe_per_task=1800

# Range yükseltmesi enerji çarpanları. Yüksek değer, geniş menzilin FE bedelini artırır.
scan.energy.range_multiplier.level_0=1.0
scan.energy.range_multiplier.level_1=1.15
scan.energy.range_multiplier.level_2=1.3
scan.energy.range_multiplier.level_3=1.45

# Speed yükseltmesi enerji çarpanları. Yüksek hızın FE bedelini belirler.
scan.energy.speed_multiplier.level_0=1.0
scan.energy.speed_multiplier.level_1=1.3
scan.energy.speed_multiplier.level_2=1.6
scan.energy.speed_multiplier.level_3=1.9

# Accuracy yükseltmesi enerji çarpanları. Daha ayrıntılı taramanın FE bedelini belirler.
scan.energy.accuracy_multiplier.level_0=1.0
scan.energy.accuracy_multiplier.level_1=1.08
scan.energy.accuracy_multiplier.level_2=1.18
scan.energy.accuracy_multiplier.level_3=1.3

# Efficiency yükseltmesinin toplam maliyete uyguladığı yüzde. Düşük yüzde = daha az FE tüketimi.
scan.energy.efficiency_percent.level_0=100
scan.energy.efficiency_percent.level_1=82
scan.energy.efficiency_percent.level_2=65
scan.energy.efficiency_percent.level_3=50
