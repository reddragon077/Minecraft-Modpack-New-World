# NEW WORLD - FE MATRIX VE WARP MATRIX AYARLARI

# Toplam FE kapasitesi = base + (Storage modülü x per_storage) + (Emergency modülü x per_emergency).
fe.capacity.base=1000000
fe.capacity.per_storage_module=1000000
fe.capacity.per_emergency_module=250000

# Her Provider modülünün temel FE/t aktarım katkısı.
# I/O modülleri Provider katkısının ikinci kısmını açar; darboğaz düşük olan taraftadır.
fe.transfer.per_provider_module=25000

# Her I/O modülünün açabileceği Provider bonus aktarım sınırı (FE/t).
# Tek başına I/O aktarım üretmez; Provider kapasitesiyle birlikte çalışır.
fe.transfer.per_io_module=100000

# FE tier ağırlıkları, farklı tier modüllerin Matrix toplamına göreli katkısını belirler.
# Yüksek tier değerini büyütmek o tier modülünü kapasite/işlem hesabında daha güçlü yapar.
fe.tier_weight.1=1
fe.tier_weight.2=4
fe.tier_weight.3=16
fe.tier_weight.4=64
fe.tier_weight.5=256
fe.tier_weight.6=1024
fe.tier_weight.7=4096
fe.tier_weight.8=16384

# Warp tier ağırlıkları, farklı tier Warp bileşenlerinin göreli katkısını belirler.
warp.tier_weight.1=1
warp.tier_weight.2=2
warp.tier_weight.3=3
warp.tier_weight.4=4
warp.tier_weight.5=5
warp.tier_weight.6=6
warp.tier_weight.7=7
warp.tier_weight.8=8

# Her etkin Warp Capacitor modülünün eklediği Warp Energy (WE) kapasitesi.
warp.capacity.per_capacitor_module=1000

# Bir WE üretmek/kullanmak için başlangıç FE bedeli.
warp.fe_per_we.base=10000

# Her Efficiency Coil'in FE/WE bedelinden düşürdüğü miktar.
warp.fe_per_we.reduction_per_coil=500

# Coil sayısı ne olursa olsun FE/WE maliyetinin inemeyeceği alt sınır.
warp.fe_per_we.minimum=4000

# Her Catalyst modülünün aktif Warp Producer üretimine eklediği yüzde bonus.
warp.production.bonus_percent_per_catalyst=10

# Catalystlerden gelebilecek toplam üretim bonusu tavanı.
warp.production.max_bonus_percent=100
