# Gemi uyarıları. Canlı yeniden okunur; dünya, rota, enerji veya buffer içeriğini değiştirmez.
# true: sunucu uyarı örneklemesini açar. false: geçmiş gizlenir; kaydedilmiş dünya verisi silinmez.
enabled=true
# Tick; 20-1200. Düşürmek algılamayı hızlandırır ancak ağ/örnekleme yükünü artırır (20 tick ~ 1 saniye).
refresh_ticks=40
# Oturum başına olay sayısı; 4-32. Artırmak geçmişi ve ağ paketini büyütür. Oyundan çıkınca geçmiş sıfırlanır.
history_limit=16
# WE yüzdesi; 1-99. Daha yüksek eşik daha erken uyarır. Kapasitesi bilinmeyen veri LOW sayılmaz.
warp.warning_percent=20
# WE yüzdesi; 0-98, warning eşiğini aşamaz. Yükseltmek kritik bildirimi erkene alır.
warp.critical_percent=5
# Collection sanal TÜR slotu yüzdesi; 1-99. Yükseltmek uyarıyı geciktirir. Eşya kapasitesi değildir.
# %100 tür slotu, mevcut türlerden daha fazla eşya alınamaz anlamına gelmez; gerçek BUFFER_FULL ayrı izlenir.
collection.warning_percent=80
# true: durum değişimlerini küçük vanilla HUD/action-bar bildirimi olarak gösterir; GUI kapalıyken de çalışır.
# false: yalnız GUI geçmişi. Başka modların action-bar mesajlarıyla aynı görüntü alanını paylaşır.
notifications.enabled=true
# Aynı tür bildirimleri arası saniye; 5-3600. Artırmak dalgalanma spamını azaltır; geçmişi etkilemez.
notifications.repeat_seconds=60
# Ayrı bildirimler arası saniye; 3-30. Yükseltmek görüntü çakışmasını azaltır, bildirimi geciktirir.
# Kritik seviyeye yükseliş aynı tür tekrar süresini beklemez. Kuyruk güvenlik sınırı 3 olaydır.
notifications.spacing_seconds=4
