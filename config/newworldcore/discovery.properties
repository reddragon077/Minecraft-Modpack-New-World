# NEW WORLD - DISCOVERY DATABASE ANALIZ SEVIYESI AYARLARI
# Analiz seviyeleri 0-3 araligindadir ve discovery kaydina kalici olarak yazilir.
# 0 = ANOMALY: Yalnizca jeolojik anomali gorulur.
# 1 = METALLIC: Sinyalin metalik oldugu anlasilir.
# 2 = RESOURCE-RICH: Zengin bir kaynak yatagi oldugu anlasilir.
# 3 = EXACT FAMILY: Gercek deposit ailesi ve ana kaynak adi acilir.
# Bir kayit daha yuksek seviyeye ulastiginda sonraki dusuk seviye taramalar onu dusurmez.

# Structure Radar tarafindan eklenen yerinde dogrulanmamis yapi adaylarinin baslangic seviyesi.
# 0 onerilir; yuksek deger radar adaylarini daha erken analiz edilmis sayar.
analysis.structure_radar_level=0

# Oyuncu Structure Field Survey ile yerinde taninan yapilarin baslangic seviyesi.
# 1 onerilir; cunku gercek structure start kaydi oyuncunun yakininda dogrulanmistir.
analysis.structure_field_level=1

# Eski/dogrudan Radar kayit yollari icin guvenli taban seviye.
# Yeni zamanli Radar asagidaki Accuracy eslemesini kullanir.
analysis.geology_radar_level=0

# Radar Accuracy modulu -> kalici analiz seviyesi eslemesi.
# Varsayilan 0/1/2/2 zinciri henuz kendi Accuracy kademesinde acilmamis aileleri
# anomaly -> metallic -> resource-rich olarak ilerletir. Asagidaki aile esikleri gecilince
# ilgili kayit L3 exact family olur. Field Survey bu esigi beklemeden aileyi erkenden acabilir.
analysis.geology_radar_accuracy_0_level=0
analysis.geology_radar_accuracy_1_level=1
analysis.geology_radar_accuracy_2_level=2
analysis.geology_radar_accuracy_3_level=2

# DEPOSIT AILELERININ KADEMELI ACILIS AYARLARI
# Deger 0-3 arasinda o ailenin gercek adinin hangi Radar Accuracy seviyesinde acilacagini belirtir.
# 0 = modulesuz/temel Radar, 1 = Accuracy I, 2 = Accuracy II, 3 = Accuracy III.
# Degeri dusurmek aileyi daha erken; yukseltmek daha gec acarak ilerlemeyi zorlastirir.
# Ayni ailenin daha once Field Survey ile L3 olmus kayitlari sonraki taramalarda kapanmaz.
# Her satir tek bir gercek deposit ailesidir; degeri degistirerek o madeni istediginiz
# Accuracy kademesine tasiyabilirsiniz. Degisiklikler oyunu yeniden baslatinca uygulanir.

# TEMEL RADAR / ACCURACY 0
reveal.required_accuracy.iron_oxide=0
reveal.required_accuracy.copper_sulfide=0
reveal.required_accuracy.carboniferous=0

# ACCURACY I
reveal.required_accuracy.quartz_vein=1
reveal.required_accuracy.gold_lode=1
reveal.required_accuracy.redstone_cluster=1
reveal.required_accuracy.lapis_basin=1
reveal.required_accuracy.tin_lode=1
reveal.required_accuracy.lead_galena=1
reveal.required_accuracy.zinc_lode=1

# ACCURACY II
reveal.required_accuracy.diamond_pipe=2
reveal.required_accuracy.emerald_shear=2
reveal.required_accuracy.osmium_strata=2
reveal.required_accuracy.fluorite_crystal=2
reveal.required_accuracy.bauxite_strata=2
reveal.required_accuracy.nickel_sulfide=2
reveal.required_accuracy.silver_vein=2
reveal.required_accuracy.certus_quartz_matrix=2

# ACCURACY III
reveal.required_accuracy.uranium_pitchblende=3
reveal.required_accuracy.platinum_intrusion=3
reveal.required_accuracy.uraninite_pocket=3

# Geological Field Survey fiziksel kanit buldugunda verilen taban seviye.
# 2, depositi resource-rich olarak acar; daha onceki yuksek seviye asla dusmez.
analysis.geology_field_level=2

# Field Survey bu kadar eslesen gercek blok bulursa exact family seviyesine cikar.
# Daha yuksek deger daha guclu fiziksel kanit ister ama tarama kontrol maliyetini artirabilir.
analysis.geology_field_exact_minimum_matches=8

# Exact esik gecildiginde verilecek seviye. Normal kullanimda 3 olarak birakilmalidir.
analysis.geology_field_exact_level=3

# Oyuncuya gosterilen asamali jeoloji adlari. Seviye 3 her zaman gercek family adini kullanir.
# Bunlar yalnizca gorunum metnidir; kayittaki gercek deposit kimligini degistirmez.
display.geology_level_0_label=GEOLOGICAL ANOMALY
display.geology_level_1_label=METALLIC ANOMALY
display.geology_level_2_label=RESOURCE-RICH DEPOSIT

# Ana kaynak satirinin seviye 0-2 icin maskelenmis metinleri.
display.geology_level_0_resource=unknown signal
display.geology_level_1_resource=metallic signature
display.geology_level_2_resource=resource-rich signature
