# NEW WORLD - DISCOVERY DATABASE ANALIZ SEVIYESI AYARLARI
# Analiz seviyeleri 0-3 araligindadir ve discovery kaydina kalici olarak yazilir.
# 0 = DETECTED: Radar olasi hedefi tespit etti, yerinde dogrulanmadi.
# 1 = IDENTIFIED: Hedefin ailesi/tipi guvenilir bicimde tanimlandi.
# 2 = ANALYZED: Ileride Research sisteminin ayrintili saha analiz seviyesi.
# 3 = MASTERED: Ileride Research sisteminin tamamlanmis analiz seviyesi.
# Bir kayit daha yuksek seviyeye ulastiginda sonraki dusuk seviye taramalar onu dusurmez.

# Structure Radar tarafindan eklenen yerinde dogrulanmamis yapi adaylarinin baslangic seviyesi.
# 0 onerilir; yuksek deger radar adaylarini daha erken analiz edilmis sayar.
analysis.structure_radar_level=0

# Oyuncu Structure Field Survey ile yerinde taninan yapilarin baslangic seviyesi.
# 1 onerilir; cunku gercek structure start kaydi oyuncunun yakininda dogrulanmistir.
analysis.structure_field_level=1

# Geological Radar ile veri tabanina yazilan fiziksel deposit hedeflerinin baslangic seviyesi.
# 1 onerilir; tarama deposit ailesini ve koordinatini dogrudan tanimlar.
analysis.geology_radar_level=1

# Ileride Geological Field Survey ile yerinde dogrulanacak depositlerin baslangic seviyesi.
# Sistem devreye girdiginde 2, ayrintili saha analizi anlamina gelecektir.
analysis.geology_field_level=2
