# NEW WORLD - MOTOR / ISINLANMA MENZILI AYARLARI
# Efektif menzil = base_range x (range_multiplier ^ etkin motor modülü), sonra modül tavanı uygulanır.

# Etkin motor modülü yokken geminin temel seyahat menzili (blok).
engine.base_range_blocks=512

# Her etkin motor modülünde menzile üstel uygulanan çarpan. 2.0 her modülde menzili ikiye katlar.
# Büyük değişiklikler menzili çok hızlı büyütür; 1.0 yapılırsa modüller menzili artırmaz.
engine.range_multiplier_per_module=2.0

# Menzil formülünde hesaba katılacak azami etkin motor modülü sayısı.
# Bu değerin üzerindeki modüller başka sistemlerde var olabilir ama seyahat menzilini büyütmez.
engine.max_effective_modules=22
