# NEW WORLD - REPLIKASYON BESLEME AYARLARI
# 20 tick yaklaşık 1 saniyedir.

# Replikasyon kuyruğunun kaç tickte bir hedefe ürün göndereceği. Düşük değer = daha hızlı ve daha yoğun işlem.
feed.interval_ticks=5

# Her besleme çevriminde işlenebilecek/gönderilebilecek azami eşya sayısı.
# Yüksek değer backlog'u hızlı boşaltır fakat tek çevrimde daha fazla iş yapar.
feed.batch_items=64
