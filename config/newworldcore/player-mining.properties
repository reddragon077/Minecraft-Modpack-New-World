# Mining bilgi yenilemesi: tick (20 tick ~ 1 saniye). 20-1200; azaltmak ag/sunucu isini artirir. Canli okunur.
refresh_ticks=20
# Veriyi gizleme suresi: tick, 40-3600 ve en az iki yenileme. Artirmak eski veriyi daha uzun gosterir; madenciligi etkilemez.
stale_after_ticks=120
# Tarama boyutu/merkez chunk gorunumu. false yalniz bilgiyi gizler; tarama alani degismez. Canli okunur.
show_scan_area=true
# Uc bufferin esya ve tur sayilarini goster. false yalniz gorunumu gizler; aktarim/kapasite degismez. Canli okunur.
show_buffers=true
# En cok kazilan kaynak satiri: 1-5. Artirmak daha fazla kaynak gosterir; kazim hizini/rezervi degistirmez. Canli okunur.
top_resources.rows=5
# Uzaktan durdurma: true yalniz iki onayli Mining Shield OFF islemine izin verir; baslatma/el freni/rota degismez. Sunucu canli okur.
stop.enabled=true
# Sunucu onay suresi: tick, 40-200. Artirmak onayi uzatir. Istemci guvenlik icin onay dugmesini en fazla 2 saniye tutar.
stop.confirm_ticks=100
# Basarili durdurmadan sonra bekleme: tick, 20-1200. Artirmak tekrar isteklerini azaltir. Canli okunur.
stop.cooldown_ticks=40
