# Mining bilgi yenilemesi: tick (20 tick ~ 1 saniye). 20-1200; azaltmak ag/sunucu isini artirir. Canli okunur.
refresh_ticks=20
# Veriyi gizleme suresi: tick, 40-3600 ve en az iki yenileme. Artirmak eski veriyi daha uzun gosterir; madenciligi etkilemez.
stale_after_ticks=120
# Tarama boyutu/merkez chunk gorunumu. false yalniz bilgiyi gizler; tarama alani degismez. Canli okunur.
show_scan_area=true
# Uc bufferin esya ve tur sayilarini goster. false yalniz gorunumu gizler; aktarim/kapasite degismez. Canli okunur.
show_buffers=true
