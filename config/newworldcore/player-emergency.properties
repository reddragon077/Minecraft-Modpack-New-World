# Emergency ilk paket: yalnız DISTRESS hedefi; oyuncu/gemi ışınlama veya WE tüketimi yok.
# Ayarlar canlı yenilenir; dosya yoksa güvenli varsayılanlar kullanılır.
# Hedef izni gui.properties içindeki ortak Discoveries hedef iznini de gerektirir.
# Kayıt kotası player-navigation.properties location.max_per_ship ile ortaktır.

# Aç/kapat. false acil hedef gönderimini kapatır; mevcut hedef/rota/kayıtlar silinmez.
beacon.enabled=true
# Tick; 20 tick yaklaşık 1 saniye. Yükseltmek veri/ağ yükünü azaltır ama görünümü geciktirir. Sınır 20–1200.
refresh_ticks=20
# Tick; veri bu süreden eskiyse eylem kapanır. Yükseltmek bayat görüntü süresini artırır. Sınır 40–3600 ve en az 2x yenileme.
stale_after_ticks=120
# Tick; sunucunun tek kullanımlık onay ömrü. Yükseltmek onay süresini uzatır. Sınır 40–200; ekranda en fazla 2 saniye.
beacon.confirm_ticks=100
# Tick; gönderimden sonraki bekleme. Yükseltmek tekrar kayıt/hedef değiştirme yükünü azaltır. Sınır 20–1200.
beacon.cooldown_ticks=200
