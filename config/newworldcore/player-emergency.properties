# Acil dönüş: kendi geminin içinde, normal portal girişindeki kapı önüne. Beacon kaldırıldı.
# Tümü canlı yenilenir; eski beacon.* anahtarları artık kullanılmaz. Hedef/rota ve WE değişmez.

# Aç/kapat; false yeni dönüşleri kapatır. Kayıtlı süreyi veya eski kayıtları silmez.
return.enabled=true
# Tick; 20 tick yaklaşık 1 saniye. Yükseltmek veri/ağ yükünü azaltır ama görünümü geciktirir. Sınır 20–1200.
refresh_ticks=20
# Tick; veri bu süreden eskiyse eylem kapanır. Yükseltmek bayat görüntü süresini artırır. Sınır 40–3600 ve en az 2x yenileme.
stale_after_ticks=120
# Tick; sunucunun tek kullanımlık onay ömrü. Yükseltmek onay süresini uzatır. Sınır 40–200; ekranda en fazla 2 saniye.
return.confirm_ticks=100
# Gerçek dakika; başarılı dönüş sonrası bekleme. Artırmak kullanım sıklığını azaltır. Sınır 1–1440.
# Çıkış/giriş ve ölüm sıfırlamaz; çevrimdışı zaman sayılır. Yalnız sonraki başarılı dönüşe uygulanır.
return.cooldown_minutes=30
