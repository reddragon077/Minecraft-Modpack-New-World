# NEW WORLD - YAPI RADARI VE NAVIGASYON AYARLARI
# 20 tick yaklaşık 1 saniyedir. level_0 yükseltmesiz, level_1/2/3 yükseltme seviyeleridir.
# Dosya oyun çalışırken yeniden okunabilir; yeni Radar taraması önbelleği ayrıca yeniler.

# Radarın kaç tickte bir yeni görev paketi çalıştıracağını belirler.
# Küçük değer = daha hızlı tarama ama daha yüksek anlık CPU/tick yükü.
# 4 = eski hız, 8 = yaklaşık yarı hız (önerilen), 16 = yaklaşık çeyrek hız.
# Değer güvenlik için en yakın üst 4 tick katına yuvarlanır; izin verilen aralık 4-1200.
scan.batch_interval_ticks=8

# Bir taramadan listede tutulabilecek en yakın sonuç sayısı. Taramanın tamamlanmasını durdurmaz.
# Yükseltmek daha çok sonuç gösterir fakat ağ, bellek ve GUI yükünü artırır. Aralık: 1-512.
scan.max_results=128

# Bir taramada işlenebilecek structure-placement görevleri için güvenlik tavanı.
# Çok fazla yapı modu eklenirse artırılabilir; yükseltmek tarama yükünü artırabilir. Aralık: 1-2048.
scan.max_placement_tasks=512

# Aynı aileye ait birbirine çok yakın adayların tek sonuç sayılacağı yarıçap (blok).
# 0 birleştirmeyi kapatır; yüksek değer yakın fakat ayrı yapıları yanlışlıkla birleştirebilir. Aralık: 0-128.
scan.duplicate_radius_blocks=8

# Efektif Radar menzili = base_blocks + (Range yükseltme seviyesi x per_upgrade_blocks).
# Daha yüksek menzil daha uzak adayları kapsar, fakat görev/enerji ve dünya hesaplama yükünü büyütebilir.
navigation.range.base_blocks=2000
navigation.range.per_upgrade_blocks=1000

# Her zamanlayıcı paketinde işlenecek navigasyon karosu/görevi.
# Efektif değer = base + (Speed seviyesi x per_upgrade). Yüksek değer taramayı hızlandırır ama tick yükünü artırır.
navigation.tiles_per_batch.base=1
navigation.tiles_per_batch.per_upgrade=1

# Yapı sınıflandırmasında Accuracy yükseltmesinin kontrol edeceği chunk iş yükü.
# Efektif değer = base + (Accuracy seviyesi x per_upgrade). Yüksek değer daha kapsamlı ama daha ağırdır.
navigation.classification.base_chunks=2
navigation.classification.per_upgrade_chunks=1

# Bir adayın gerçek yapı ailesiyle eşleştirilmesinde kullanılan blok yarıçapı.
# Efektif yarıçap = base + (Accuracy seviyesi x per_upgrade). Çok yüksek değer komşu yapıları karıştırabilir.
navigation.classification.base_radius_blocks=64
navigation.classification.per_upgrade_radius_blocks=32

# Efficiency yükseltmesinin FE maliyetine uyguladığı yüzde. Düşük yüzde = daha az enerji tüketimi.
navigation.efficiency.percent.level_0=100
navigation.efficiency.percent.level_1=82
navigation.efficiency.percent.level_2=65
navigation.efficiency.percent.level_3=50

# CPU Speed yükseltmesinin tarama süresine uyguladığı çarpan. Düşük değer = daha hızlı işlem.
navigation.cpu.time_multiplier.level_0=1.0
navigation.cpu.time_multiplier.level_1=0.72
navigation.cpu.time_multiplier.level_2=0.52
navigation.cpu.time_multiplier.level_3=0.38

# CPU Speed yükseltmesinin enerji ihtiyacına uyguladığı çarpan. Yüksek hızın FE bedelini belirler.
navigation.cpu.power_multiplier.level_0=1.0
navigation.cpu.power_multiplier.level_1=1.3
navigation.cpu.power_multiplier.level_2=1.7
navigation.cpu.power_multiplier.level_3=2.2

# Her Radar placement görevinin yükseltmesiz temel FE maliyeti.
# Nihai görev maliyeti = base x Range x Speed x Accuracy x Efficiency yüzdesi.
energy.base_fe_per_task=1800

# Range seviyelerinin görev başına FE maliyeti çarpanı.
energy.range_multiplier.level_0=1.0
energy.range_multiplier.level_1=1.15
energy.range_multiplier.level_2=1.3
energy.range_multiplier.level_3=1.45

# Speed seviyelerinin görev başına FE maliyeti çarpanı.
energy.speed_multiplier.level_0=1.0
energy.speed_multiplier.level_1=1.3
energy.speed_multiplier.level_2=1.6
energy.speed_multiplier.level_3=1.9

# Accuracy seviyelerinin görev başına FE maliyeti çarpanı.
energy.accuracy_multiplier.level_0=1.0
energy.accuracy_multiplier.level_1=1.08
energy.accuracy_multiplier.level_2=1.18
energy.accuracy_multiplier.level_3=1.3
